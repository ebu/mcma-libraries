// The shared workspace lock resolves unpublished MCMA packages locally.
// Gradle remains the entry point; dependency ordering is handled by build.cjs.
tasks.register('npmInstall') { dependsOn ':installDependencies' }
tasks.register('tsc') { dependsOn ':buildLibraries' }
tasks.register('setVersion') { dependsOn ':setVersion' }
tasks.register('npmPublish') { dependsOn ':publishRelease' }
tasks.register('npmPublishLocal') { dependsOn ':publishLocalRelease' }
tasks.register('npmUpdate') { dependsOn ':updateDependencies' }
tasks.register('npmAudit') { dependsOn ':auditDependencies' }
tasks.register('npmAuditFix') { dependsOn ':fixDependencyAudit' }
tasks.register('npmForceAuditFix') { dependsOn ':forceFixDependencyAudit' }
tasks.register('cleanPackageLocks') { dependsOn ':removeDependencyLock' }
tasks.register('clean', Delete) {
    delete 'dist', 'build', 'node_modules'
}
