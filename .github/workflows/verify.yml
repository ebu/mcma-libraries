name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Use the verified npm version
        run: npm install --global npm@11.10.0 --ignore-scripts
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - name: Locate npm diagnostic logs
        shell: bash
        run: echo "NPM_LOG_DIR=$(npm config get cache)/_logs" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify through Gradle (Linux)
        if: runner.os != 'Windows'
        run: bash ./gradlew prepareRelease --no-daemon
      - name: Verify through Gradle (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat prepareRelease --no-daemon
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ env.NPM_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7
      - run: git diff --exit-code
