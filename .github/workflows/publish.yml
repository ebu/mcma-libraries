name: Stage release
run-name: ${{ inputs.stage && 'Stage release' || 'Verify release' }}
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage on npm for manual approval (leave off for a dry run)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'ebu/mcma-libraries'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Read and display release version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const match = fs.readFileSync('gradle.properties', 'utf8').match(/^VERSION=(.+)$/m);
          const version = match?.[1].trim();
          assert.match(version || '', /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          console.log(`Release version: ${version}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Release version: ${version}\n\nRead from the checked-out gradle.properties.\n`);
          NODE
      - name: Use the verified npm version
        run: npm install --global npm@11.10.0 --ignore-scripts
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - name: Locate npm diagnostic logs
        shell: bash
        run: echo "NPM_LOG_DIR=$(npm config get cache)/_logs" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, test and pack with Gradle (Linux)
        if: runner.os != 'Windows'
        run: bash ./gradlew prepareRelease --no-daemon
      - name: Build, test and pack with Gradle (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat prepareRelease --no-daemon
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ env.NPM_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Check that preparation did not change tracked files
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: npm-release
          path: build/release/
          if-no-files-found: error
          retention-days: 30
  stage:
    needs: prepare
    if: inputs.stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read and display release version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const match = fs.readFileSync('gradle.properties', 'utf8').match(/^VERSION=(.+)$/m);
          const version = match?.[1].trim();
          assert.match(version || '', /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          console.log(`Release version: ${version}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Release version: ${version}\n\nRead from the checked-out gradle.properties.\n`);
          NODE
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: build/release/
      - name: Check release tag before staging
        run: node scripts/github-release.cjs check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage the verified tarballs using npm trusted publishing
        run: bash ./gradlew stageRelease --no-daemon
