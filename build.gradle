allprojects {
    ext {
        nodeExecutable = ['node']
        npmExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows() ? ['cmd', '/c', 'npm'] : ['npm']
    }
}

tasks.register('verifyNodeJS', Exec) {
    commandLine nodeExecutable + ['scripts/verify-tools.cjs']
}
tasks.register('installDependencies', Exec) {
    dependsOn 'verifyNodeJS'
    commandLine npmExecutable + ['ci', '--ignore-scripts', '--no-audit', '--no-fund']
}
tasks.register('verifyTsc', Exec) {
    dependsOn 'installDependencies'
    commandLine nodeExecutable + ['scripts/verify-tools.cjs', '--typescript']
}
tasks.register('buildLibraries', Exec) {
    dependsOn 'verifyTsc'
    commandLine npmExecutable + ['run', 'build']
}
tasks.register('verifyLibraries', Exec) {
    dependsOn 'verifyTsc'
    commandLine npmExecutable + ['run', 'verify']
}
tasks.register('prepareRelease') {
    group = 'publishing'
    description = 'Build, test and pack all libraries without publishing.'
    dependsOn 'verifyLibraries'
}
tasks.register('publishRelease', Exec) {
    group = 'publishing'
    description = 'Publish previously verified tarballs; restricted to the manual GitHub workflow.'
    // Intentionally do not rebuild the downloaded, already tested release artifact.
    commandLine npmExecutable + ['run', 'release:publish']
}
tasks.register('publishLocalRelease', Exec) {
    dependsOn 'prepareRelease'
    commandLine npmExecutable + ['run', 'release:publish-local']
}
tasks.register('setVersion', Exec) {
    def requestedVersion = providers.gradleProperty('releaseVersion').orElse(VERSION).get()
    commandLine npmExecutable + ['run', 'release:version', '--', requestedVersion]
}
tasks.register('updateDependencies', Exec) {
    commandLine npmExecutable + ['update']
}
tasks.register('auditDependencies', Exec) {
    commandLine npmExecutable + ['audit']
}
tasks.register('fixDependencyAudit', Exec) {
    commandLine npmExecutable + ['audit', 'fix']
}
tasks.register('forceFixDependencyAudit', Exec) {
    commandLine npmExecutable + ['audit', 'fix', '--force']
}
tasks.register('removeDependencyLock', Delete) {
    delete 'package-lock.json'
}
tasks.register('setNpmRegistryToLocal', Exec) {
    commandLine npmExecutable + ['set', 'registry', 'http://localhost:4873/']
}
tasks.register('setNpmRegistryToPublic', Exec) {
    commandLine npmExecutable + ['set', 'registry', 'https://registry.npmjs.org/']
}
tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
